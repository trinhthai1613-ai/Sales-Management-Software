<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Voucher</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">🎟️ Quản lý Voucher</h3>
        <a href="/vouchers/create" class="btn btn-primary">+ Thêm voucher</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <!-- Search -->
    <form method="get" action="/vouchers" class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" name="keyword" class="form-control"
                   placeholder="Tìm theo mã hoặc tên..." th:value="${keyword}">
        </div>
        <div class="col-md-3">
            <select name="status" class="form-select">
                <option value="">-- Tất cả trạng thái --</option>
                <option value="ACTIVE"   th:selected="${status == 'ACTIVE'}">Đang hoạt động</option>
                <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">Ngừng hoạt động</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Tìm kiếm</button>
            <a href="/vouchers" class="btn btn-outline-danger">Xóa lọc</a>
        </div>
    </form>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Mã</th>
                    <th>Tên voucher</th>
                    <th>Loại giảm</th>
                    <th>Giá trị</th>
                    <th>Thời hạn</th>
                    <th>Đã dùng</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v, stat : ${vouchers}">
                    <td th:text="${stat.count}"></td>
                    <td><span class="badge bg-secondary" th:text="${v.code}"></span></td>
                    <td th:text="${v.nameVoucher}"></td>
                    <td th:text="${v.discountType == 'PERCENT' ? 'Phần trăm' : 'Cố định'}"></td>
                    <td th:text="${v.discountType == 'PERCENT'
                            ? v.discountValue + '%'
                            : v.discountValue + ' đ'}"></td>
                    <td th:text="${v.startDate + ' → ' + v.endDate}"></td>
                    <td th:text="${v.usedCount + ' / ' + (v.usageLimit ?: '∞')}"></td>
                    <td>
                            <span th:class="${v.status.name() == 'ACTIVE'
                                ? 'badge bg-success' : 'badge bg-danger'}"
                                  th:text="${v.status.name() == 'ACTIVE'
                                ? 'Hoạt động' : 'Ngừng'}">
                            </span>
                    </td>
                    <td>
                        <a th:href="@{/vouchers/edit/{id}(id=${v.id})}"
                           class="btn btn-sm btn-outline-primary">Sửa</a>
                        <a th:href="@{/vouchers/delete/{id}(id=${v.id})}"
                           class="btn btn-sm btn-outline-danger">Xóa</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vouchers)}">
                    <td colspan="9" class="text-center text-muted py-4">
                        Không có voucher nào
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
