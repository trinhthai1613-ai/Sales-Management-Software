<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa Voucher' : 'Thêm Voucher'"></title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 700px">

    <h4 class="fw-bold mb-4"
        th:text="${isEdit} ? '✏️ Sửa Voucher' : '➕ Thêm Voucher mới'"></h4>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${isEdit}
                    ? @{/vouchers/edit/{id}(id=${voucherDTO.id})}
                    : @{/vouchers/create}"
                  th:object="${voucherDTO}" method="post">

                <div class="row g-3">
                    <!-- Mã voucher -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mã voucher *</label>
                        <input type="text" th:field="*{code}" class="form-control"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                               placeholder="VD: SALE50">
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                    </div>

                    <!-- Tên voucher -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tên voucher *</label>
                        <input type="text" th:field="*{nameVoucher}" class="form-control"
                               th:classappend="${#fields.hasErrors('nameVoucher')} ? 'is-invalid'"
                               placeholder="VD: Giảm 50k cho đơn từ 200k">
                        <div class="invalid-feedback" th:errors="*{nameVoucher}"></div>
                    </div>

                    <!-- Loại giảm -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Loại giảm giá *</label>
                        <select th:field="*{discountType}" class="form-select"
                                th:classappend="${#fields.hasErrors('discountType')} ? 'is-invalid'">
                            <option value="">-- Chọn loại --</option>
                            <option value="PERCENT">Phần trăm (%)</option>
                            <option value="FIXED">Số tiền cố định (đ)</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{discountType}"></div>
                    </div>

                    <!-- Giá trị giảm -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Giá trị giảm *</label>
                        <input type="number" th:field="*{discountValue}" class="form-control"
                               th:classappend="${#fields.hasErrors('discountValue')} ? 'is-invalid'"
                               step="0.01" min="0">
                        <div class="invalid-feedback" th:errors="*{discountValue}"></div>
                    </div>

                    <!-- Đơn tối thiểu -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Đơn tối thiểu (đ)</label>
                        <input type="number" th:field="*{minOrderValue}"
                               class="form-control" step="0.01" min="0">
                    </div>

                    <!-- Giảm tối đa -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Giảm tối đa (đ)</label>
                        <input type="number" th:field="*{maxDiscountAmount}"
                               class="form-control" step="0.01" min="0">
                        <small class="text-muted">Áp dụng cho loại giảm theo %</small>
                    </div>

                    <!-- Giới hạn dùng -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Giới hạn sử dụng</label>
                        <input type="number" th:field="*{usageLimit}"
                               class="form-control" min="1"
                               th:classappend="${#fields.hasErrors('usageLimit')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{usageLimit}"></div>
                    </div>

                    <!-- Trạng thái -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Trạng thái</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Ngừng hoạt động</option>
                        </select>
                    </div>

                    <!-- Ngày bắt đầu -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày bắt đầu *</label>
                        <input type="date" th:field="*{startDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{startDate}"></div>
                    </div>

                    <!-- Ngày kết thúc -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày kết thúc *</label>
                        <input type="date" th:field="*{endDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{endDate}"></div>
                    </div>
                </div>

                <hr class="my-4">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${isEdit} ? 'Cập nhật' : 'Tạo voucher'"></span>
                    </button>
                    <a href="/vouchers" class="btn btn-outline-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
